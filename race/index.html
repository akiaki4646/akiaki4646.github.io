<style>
:root{--bg:#0b1222;--card:#131c31;--ink:#e8eefb;--dim:#93a6c4;--sky:#38bdf8;--line:#24324e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
     font-family:-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
     line-height:1.75}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 64px}
header{padding:36px 0 8px}
header img{width:100%;border-radius:14px;display:block}
h1{font-size:1.55rem;margin:24px 0 6px;letter-spacing:.01em}
h2{font-size:1.15rem;margin:40px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
p{margin:12px 0}
.lead{color:var(--dim)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:18px 0}
.kpi{display:flex;flex-wrap:wrap;gap:14px;margin:18px 0}
.kpi div{flex:1 1 150px;background:var(--card);border:1px solid var(--line);
         border-radius:12px;padding:14px 16px}
.kpi b{display:block;font-size:1.5rem;color:var(--sky);line-height:1.3}
.kpi span{color:var(--dim);font-size:.85rem}
table{width:100%;border-collapse:collapse;margin:14px 0;font-variant-numeric:tabular-nums}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--dim);font-weight:600;font-size:.85rem}
.gap{color:var(--dim)}
tr.thin td{color:var(--dim);opacity:.72}
tr.thin td:first-child::after{content:" *";color:var(--sky)}
a{color:var(--sky)}
footer{margin-top:52px;padding-top:18px;border-top:1px solid var(--line);
       color:var(--dim);font-size:.85rem}
.follow{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}
.follow a{display:inline-block;padding:10px 18px;border:1px solid var(--sky);
         border-radius:999px;color:var(--sky);text-decoration:none;font-size:.9rem}
.follow a:hover{background:var(--sky);color:var(--bg)}
@media(max-width:520px){.kpi div{flex:1 1 100%}}

.race{background:var(--card);border:1px solid var(--line);border-radius:12px;
      padding:16px 18px;margin:16px 0}
.race h3{margin:0 0 4px;font-size:1.05rem}
.race .meta{color:var(--dim);font-size:.85rem;margin:0 0 10px}
.race table{margin:0}
.race td.mk{width:2.2em;text-align:center;color:var(--sky);font-weight:700}
.race td.no{width:2.6em;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
.race td.nm{text-align:left}
.race td.pb{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.race tr.top td{color:var(--ink)}
.race tr:not(.top) td{color:var(--dim)}
.done{opacity:.55}
.badge{display:inline-block;font-size:.72rem;border:1px solid var(--line);
       border-radius:999px;padding:1px 8px;margin-left:6px;color:var(--dim)}
.adslot{margin:24px 0;min-height:0}
.nav{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}
.nav a{display:inline-block;padding:9px 16px;border:1px solid var(--sky);
       border-radius:999px;color:var(--sky);text-decoration:none;font-size:.88rem}
.nav a:hover{background:var(--sky);color:var(--bg)}
.archive li{margin:6px 0}
